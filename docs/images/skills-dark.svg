<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Curated Agent Skills</title>
  <desc id="desc">Two skills use a shared flow: match a task, read the full skill, and verify the result. The second skill, herdr-subagent, is called 包工头 (foreman).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="68" r="150" fill="#364fc7" opacity=".28"/>
  <circle cx="1110" cy="74" r="82" fill="#0b7285" opacity=".35"/>
  <g fill="#e2e8f0" opacity=".17">
    <circle cx="52" cy="72" r="2"/><circle cx="82" cy="72" r="2"/><circle cx="112" cy="72" r="2"/>
    <circle cx="52" cy="102" r="2"/><circle cx="82" cy="102" r="2"/><circle cx="112" cy="102" r="2"/>
  </g>
  <text x="78" y="108" fill="#91a7ff" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CURATED AGENT SKILLS</text>
  <text x="78" y="170" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="38" font-weight="700">Find the skill. Read the rules.</text>
  <text x="78" y="211" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="22">Act with evidence, then verify the result.</text>
  <path d="M78 252H1122" stroke="#475569" stroke-width="1"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="78" y="286" width="470" height="114" rx="18" fill="#1e293b" stroke="#475569"/>
    <rect x="78" y="286" width="6" height="114" rx="3" fill="#748ffc"/>
    <text x="108" y="328" fill="#91a7ff" font-size="13" font-weight="700" letter-spacing="2">01 · MEDIA ARCHIVING</text>
    <text x="108" y="365" fill="#f8fafc" font-size="26" font-weight="700">dycopy</text>
    <text x="244" y="365" fill="#cbd5e1" font-size="17">collect · transcribe · verify</text>
    <rect x="574" y="286" width="548" height="114" rx="18" fill="#1e293b" stroke="#475569"/>
    <rect x="574" y="286" width="6" height="114" rx="3" fill="#3bc9db"/>
    <text x="604" y="328" fill="#66d9e8" font-size="13" font-weight="700" letter-spacing="2">02 · AGENT ORCHESTRATION</text>
    <text x="604" y="365" fill="#f8fafc" font-size="26" font-weight="700">包工头</text>
    <text x="712" y="365" fill="#cbd5e1" font-size="17">herdr-subagent · delegate · inspect · verify</text>
  </g>
  <text x="78" y="432" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="13" letter-spacing="1">REVIEWED PUBLIC SKILLS · MACHINE-READABLE INDEX · SELF-CONTAINED REFERENCES</text>
</svg>
